<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 – Page Not Found | Global GPA</title>
<meta name="description" content="The page you were looking for doesn't exist. Head back to the Global GPA calculator.">
<meta name="robots" content="noindex, follow">
<link rel="sitemap" type="application/xml" href="/sitemap.xml">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230f172a'/><text x='32' y='50' text-anchor='middle' font-family='system-ui,sans-serif' font-size='52' font-weight='800' fill='%2300d285'>%25</text></svg>">
<style>
:root{--bg:#ffffff;--card:#ffffff;--text:#0f172a;--muted:#64748b;--primary:#00d285;--primary-dark:#00b572;--border:#f1f5f9;--shadow:rgba(0,0,0,0.04);--result-bg:#f8fafc;}
[data-theme="dark"]{--bg:#09090b;--card:#141416;--text:#f4f4f5;--muted:#a1a1aa;--primary:#00d285;--border:#27272a;--shadow:rgba(0,0,0,0.2);--result-bg:#18181b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;display:flex;flex-direction:column;}
header{padding:20px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
.logo{font-weight:700;font-size:1.1rem;text-decoration:none;display:flex;align-items:center;gap:8px;color:var(--primary);}
.theme-btn{background:transparent;border:1px solid var(--border);padding:6px 12px;border-radius:20px;cursor:pointer;color:var(--text);font-size:0.9rem;}
@media(max-width:480px){header{padding:15px 20px;}}

/* ── Error stage ── */
.error-stage{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:60px 24px;text-align:center;
}
.error-code-wrap{position:relative;display:inline-block;margin-bottom:24px;}
.error-code{
  font-size:clamp(5rem,20vw,9rem);font-weight:900;
  letter-spacing:-4px;line-height:1;
  color:var(--border);
  user-select:none;
}
.error-icon{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:clamp(2.5rem,8vw,4rem);
}
.error-title{font-size:clamp(1.3rem,3vw,1.8rem);font-weight:800;letter-spacing:-0.5px;margin-bottom:10px;}
.error-sub{font-size:0.95rem;color:var(--muted);max-width:440px;margin:0 auto 36px;line-height:1.7;}

/* ── Quick links ── */
.quick-links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:40px;}
.quick-btn{
  padding:10px 20px;border-radius:10px;font-size:0.85rem;font-weight:700;
  text-decoration:none;border:1.5px solid var(--border);
  color:var(--text);background:var(--card);transition:all 0.15s;
}
.quick-btn:hover{border-color:var(--primary);color:var(--primary);}
.quick-btn.primary-btn{background:var(--primary);color:#0f172a;border-color:var(--primary);}
.quick-btn.primary-btn:hover{background:var(--primary-dark);}

/* ── Search bar ── */
.search-wrap{width:100%;max-width:400px;}
.search-label{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;display:block;}
.search-row{display:flex;gap:8px;}
.search-input{
  flex:1;padding:11px 14px;border:1px solid var(--border);
  background:var(--result-bg);color:var(--text);font-size:0.9rem;
  border-radius:10px;font-family:inherit;transition:border-color 0.2s;
}
.search-input:focus{outline:none;border-color:var(--primary);}
.search-btn{
  padding:11px 16px;background:var(--primary);color:#0f172a;
  border:none;border-radius:10px;font-weight:700;font-size:0.85rem;
  cursor:pointer;white-space:nowrap;
}
.search-btn:hover{background:var(--primary-dark);}

/* ── Countdown ── */
.redirect-note{font-size:0.78rem;color:var(--muted);margin-top:28px;}
.countdown{font-weight:700;color:var(--primary);}

/* ── Footer strip ── */
.error-footer{border-top:1px solid var(--border);padding:18px 24px;display:flex;justify-content:center;gap:20px;flex-wrap:wrap;}
.error-footer a{font-size:0.8rem;color:var(--muted);text-decoration:none;}
.error-footer a:hover{color:var(--primary);}
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">
    <svg width="24" height="24" viewBox="0 0 64 64" style="border-radius:6px;" xmlns="http://www.w3.org/2000/svg">
      <rect width="64" height="64" rx="14" fill="#0f172a"/>
      <text x="32" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="52" font-weight="800" fill="#00d285">%</text>
    </svg>
    Global GPA
  </a>
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
</header>

<main class="error-stage">

  <div class="error-code-wrap">
    <div class="error-code">404</div>
    <div class="error-icon">🔍</div>
  </div>

  <h1 class="error-title">Page Not Found</h1>
  <p class="error-sub">The page you're looking for doesn't exist or may have been moved. But your CGPA calculator is right where you left it.</p>

  <div class="quick-links">
    <a href="index.html" class="quick-btn primary-btn">← Back to Calculator</a>
    <a href="about.html" class="quick-btn">About Us</a>
    <a href="contact.html" class="quick-btn">Report a broken link</a>
  </div>

  <div class="search-wrap">
    <span class="search-label">Or jump to a calculator</span>
    <div class="search-row">
      <input class="search-input" type="text" id="searchInput" placeholder="e.g. SGPA to CGPA…" oninput="liveSearch(this.value)" onkeydown="if(event.key==='Enter')goSearch()">
      <button class="search-btn" onclick="goSearch()">Go</button>
    </div>
    <div id="searchResults" style="margin-top:10px;"></div>
  </div>

  <p class="redirect-note">Redirecting to home in <span class="countdown" id="cd">10</span>s</p>

</main>

<footer class="error-footer">
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="privacy-policy.html">Privacy</a>
  <a href="terms.html">Terms</a>
  <a href="contact.html">Contact</a>
</footer>

<script>
// Theme
(function(){const s=localStorage.getItem('gpa-theme');if(s)document.documentElement.setAttribute('data-theme',s);updateBtn();}());
function toggleTheme(){const d=document.documentElement;const n=d.getAttribute('data-theme')==='dark'?'light':'dark';d.setAttribute('data-theme',n);localStorage.setItem('gpa-theme',n);updateBtn();}
function updateBtn(){const b=document.getElementById('themeBtn');if(b)b.textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀️ Light':'🌙 Dark';}

// Countdown redirect
let t = 10;
const cdEl = document.getElementById('cd');
const timer = setInterval(() => {
  t--;
  cdEl.textContent = t;
  if (t <= 0) { clearInterval(timer); window.location.href = 'index.html'; }
}, 1000);

// Cancel redirect on user interaction
['click','keydown','touchstart'].forEach(e => document.addEventListener(e, () => { clearInterval(timer); document.getElementById('redirect-note') && (document.querySelector('.redirect-note').style.display='none'); }, { once: true }));

// Mini search
const pages = [
  { label: 'CGPA to Percentage', url: 'index.html', desc: 'Convert CGPA to % using SPPU, VTU, CBSE formulas' },
  { label: 'Percentage to CGPA', url: 'index.html', desc: 'Reverse convert percentage back to CGPA' },
  { label: 'CGPA to GPA (4.0)', url: 'index.html', desc: 'Indian CGPA to US GPA scale' },
  { label: 'SGPA to CGPA', url: 'index.html', desc: 'Weighted cumulative CGPA from semester GPAs' },
  { label: 'Marks to CGPA', url: 'index.html', desc: 'Enter subject marks to get SGPA/CGPA' },
  { label: 'About Us', url: 'about.html', desc: 'Our story, values, and supported universities' },
  { label: 'Privacy Policy', url: 'privacy-policy.html', desc: 'Zero data collection policy' },
  { label: 'Terms & Conditions', url: 'terms.html', desc: 'Usage terms and accuracy disclaimer' },
  { label: 'Contact Us', url: 'contact.html', desc: 'Report errors or suggest features' },
];
function liveSearch(q) {
  const res = document.getElementById('searchResults');
  if (!q.trim()) { res.innerHTML = ''; return; }
  const matches = pages.filter(p => p.label.toLowerCase().includes(q.toLowerCase()) || p.desc.toLowerCase().includes(q.toLowerCase()));
  if (!matches.length) { res.innerHTML = '<p style="font-size:0.8rem;color:var(--muted);margin-top:6px;">No results found.</p>'; return; }
  res.innerHTML = matches.map(p => `
    <a href="${p.url}" style="display:block;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;text-decoration:none;background:var(--card);transition:border-color 0.15s;"
       onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='var(--border)'">
      <div style="font-size:0.85rem;font-weight:700;color:var(--text);">${p.label}</div>
      <div style="font-size:0.76rem;color:var(--muted);margin-top:2px;">${p.desc}</div>
    </a>`).join('');
}
function goSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  const match = pages.find(p => p.label.toLowerCase().includes(q.toLowerCase()));
  if (match) window.location.href = match.url;
}
</script>
</body>
</html>
